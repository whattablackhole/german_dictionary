<div class="story-exercises-container">
  <div class="page-header">
    <h1 class="page-title">Story Vocabulary Exercises</h1>
    <p class="page-subtitle">
      {{ story()?.title ?? 'Story exercises' }}
      @if (story(); as s) {
        <span class="story-badge">{{ s.level }}</span>
      }
    </p>
    <button mat-stroked-button class="back-btn" (click)="backToStories()">
      <mat-icon>arrow_back</mat-icon>
      Back to Stories
    </button>
  </div>

  <app-exercise-list
    [exercises]="storyExerciseService.exercises()"
    (complete)="onComplete($event)"
    (quit)="onQuit($event)"
  />
</div>
